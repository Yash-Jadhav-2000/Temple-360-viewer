<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugai Devi Mandir Construction update 16/09/2026</title>
    
    <!-- Pannellum 360 Viewer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        :root {
            --primary: #3b82f6; /* Modern Blue */
            --primary-hover: #2563eb;
            --surface: rgba(255, 255, 255, 0.85); /* Glassmorphic base */
            --text-dark: #1e293b;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Site Header */
        .site-header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 1200px;
        }

        .site-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .site-header p {
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
        }

        /* Main Container */
        .map-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background-color: #e2e8f0;
            display: flex;
        }

        .map-image {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: auto;
            object-fit: cover;
        }

        /* Pins Overlay Layer */
        #pinsLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Individual Pins */
        .pin {
            position: absolute;
            width: 32px; /* Slightly larger for better mobile tap */
            height: 32px;
            background-color: var(--primary);
            border: 3px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            z-index: 10;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
        }

        .pin:hover {
            transform: translate(-50%, -50%) scale(1.15);
            background-color: var(--primary-hover);
        }

        /* Pulse Animation */
        .pin::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* Tooltip */
        .pin-tooltip {
            position: absolute;
            bottom: calc(100% + 14px);
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: var(--text-dark);
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .click-hint {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .pin-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: var(--text-dark) transparent transparent transparent;
        }

        .pin:hover .pin-tooltip,
        .pin:active .pin-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* Modal / Lightbox */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition);
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.4);
            overflow: hidden;
            transform: scale(0.96) translateY(20px);
            transition: all var(--transition);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-content.fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            border-radius: 0;
            border: none;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            backdrop-filter: blur(10px);
            z-index: 2;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: -0.01em;
        }

        .modal-controls {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: #f1f5f9;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #475569;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: #e2e8f0;
            color: var(--text-dark);
            transform: scale(1.05);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .panorama-container {
            flex: 1;
            position: relative;
            background: #0f172a;
        }
        
        .pnlm-load-box {
            background-color: rgba(0,0,0,0.7) !important;
            border-radius: 8px;
        }

        /* 360 Viewer Helper Overlay */
        .viewer-helper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            text-align: center;
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .viewer-helper.show {
            opacity: 1;
            visibility: visible;
        }

        .viewer-helper-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            animation: panAnim 2s infinite ease-in-out;
        }

        @keyframes panAnim {
            0% { transform: translateX(-15px); }
            50% { transform: translateX(15px); }
            100% { transform: translateX(-15px); }
        }

        .viewer-helper h3 {
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .viewer-helper p {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 24px;
            max-width: 300px;
            line-height: 1.5;
        }

        .viewer-helper-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .viewer-helper-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }
        
        /* Admin Toast */
        .admin-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
            font-family: ui-monospace, monospace;
            font-size: 14px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s;
            z-index: 10000;
        }

        .admin-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        /* Mobile Adjustments */
        @media (max-width: 640px) {
            body { padding: 12px; }
            .site-header h1 { font-size: 24px; }
            .site-header p { font-size: 14px; }
            .modal-overlay { padding: 0; }
            .modal-content { height: 100vh; border-radius: 0; }
            .pin-tooltip { font-size: 13px; padding: 8px 12px; }
            .modal-title { font-size: 16px; }
            .viewer-helper h3 { font-size: 20px; }
            .viewer-helper p { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Site Header -->
    <header class="site-header">
        <h1>Jugai Devi Mandir</h1>
        <p>Construction Update - 16/09/2026</p>
    </header>

    <!-- Main Map Container -->
    <div class="map-container" id="mapContainer">
        <!-- Site overview image -->
        <img src="temple construction image.jpg" alt="Construction Site Overview" class="map-image" id="mapImage" draggable="false">
        <!-- Pins Overlay Layer -->
        <div id="pinsLayer"></div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">360 View</div>
                <div class="modal-controls">
                    <button class="icon-btn" id="fullscreenBtn" title="Toggle Fullscreen">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    </button>
                    <button class="icon-btn" id="closeBtn" title="Close">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            
            <!-- Local 360 Viewer Container -->
            <div class="panorama-container" id="panoramaContainer">
                <!-- Pannellum Canvas is injected here -->
                
                <!-- Viewer Helper Overlay -->
                <div class="viewer-helper" id="viewerHelper">
                    <svg class="viewer-helper-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11a3 3 0 1 0 6 0"></path>
                        <path d="M12 2v2"></path>
                        <path d="M12 20v2"></path>
                        <path d="M4 12H2"></path>
                        <path d="M22 12h-2"></path>
                        <path d="M19.07 4.93l-1.41 1.41"></path>
                        <path d="M6.34 17.66l-1.41 1.41"></path>
                        <path d="M19.07 19.07l-1.41-1.41"></path>
                        <path d="M6.34 6.34L4.93 4.93"></path>
                    </svg>
                    <h3>Explore in 360&deg;</h3>
                    <p>Click and drag to look around. Scroll or pinch to zoom in and out.</p>
                    <button class="viewer-helper-btn" id="helperBtn">Got it</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Helper Toast -->
    <div class="admin-toast" id="adminToast"></div>

    <script>
        /**
         * CONFIGURATION
         */
        const locations = [
            { id: 'pin1', title: 'Location 1', top: '68.9%', left: '70.2%', url: 'location1.jpg' },
            { id: 'pin2', title: 'Location 2', top: '62.1%', left: '64.5%', url: 'location2.jpg' },
            { id: 'pin3', title: 'Location 3', top: '58.1%', left: '45.3%', url: 'location3.jpg' },
            { id: 'pin4', title: 'Location 4', top: '42.5%', left: '68.2%', url: 'location4.jpg' }
        ];

        // --- DOM Elements ---
        const pinsLayer = document.getElementById('pinsLayer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const closeBtn = document.getElementById('closeBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const mapContainer = document.getElementById('mapContainer');
        const mapImage = document.getElementById('mapImage');
        const adminToast = document.getElementById('adminToast');
        
        // Helper elements
        const viewerHelper = document.getElementById('viewerHelper');
        const helperBtn = document.getElementById('helperBtn');
        
        let viewer = null; 

        // --- Initialize Pins ---
        function renderPins() {
            pinsLayer.innerHTML = ''; 
            
            locations.forEach(loc => {
                const pin = document.createElement('div');
                pin.className = 'pin';
                pin.style.top = loc.top;
                pin.style.left = loc.left;
                
                const tooltip = document.createElement('div');
                tooltip.className = 'pin-tooltip';
                // Added click hint below title
                tooltip.innerHTML = `${loc.title}<span class="click-hint">Click to view 360</span>`;
                
                pin.appendChild(tooltip);
                
                pin.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    openModal(loc.title, loc.url);
                });

                pinsLayer.appendChild(pin);
            });
        }

        // --- Helper Overlay Logic ---
        function checkShowHelper() {
            // Check if user has dismissed it previously
            const hasSeenHelper = localStorage.getItem('360_helper_seen');
            if (!hasSeenHelper) {
                viewerHelper.classList.add('show');
            }
        }

        helperBtn.addEventListener('click', () => {
            viewerHelper.classList.remove('show');
            localStorage.setItem('360_helper_seen', 'true');
        });

        // --- Modal & Pannellum Logic ---
        function openModal(title, url) {
            modalTitle.textContent = title;
            
            if (viewer) {
                viewer.destroy();
                viewer = null;
            }
            
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; 
            
            // Check helper display state
            checkShowHelper();
            
            setTimeout(() => {
                viewer = pannellum.viewer('panoramaContainer', {
                    "type": "equirectangular",
                    "panorama": url,
                    "autoLoad": true,
                    "showControls": true,
                    "mouseZoom": true,
                    "hfov": 100
                });
            }, 50);
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            
            // Hide helper if it was visible
            viewerHelper.classList.remove('show');
            
            setTimeout(() => {
                if (viewer) {
                    viewer.destroy();
                    viewer = null;
                }
            }, 300);
        }

        function toggleFullscreen() {
            modalContent.classList.toggle('fullscreen');
            
            if (modalContent.classList.contains('fullscreen')) {
                fullscreenBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>';
            } else {
                fullscreenBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>';
            }
            
            setTimeout(() => {
                if (viewer) viewer.resize();
            }, 300);
        }

        // --- Event Listeners ---
        closeBtn.addEventListener('click', closeModal);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // --- Admin / Pin-Positioning Helper Tool ---
        let toastTimeout;
        
        mapImage.addEventListener('click', (e) => {
            if (e.shiftKey) {
                const rect = mapImage.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const percentX = ((x / rect.width) * 100).toFixed(1);
                const percentY = ((y / rect.height) * 100).toFixed(1);
                
                const locationString = `{ top: '${percentY}%', left: '${percentX}%' }`;
                
                console.log('📌 New Pin Location:');
                console.log(locationString);
                
                showToast(`Copied to console: ${locationString}`);
                
                const tempDot = document.createElement('div');
                tempDot.style.position = 'absolute';
                tempDot.style.top = `${percentY}%`;
                tempDot.style.left = `${percentX}%`;
                tempDot.style.width = '10px';
                tempDot.style.height = '10px';
                tempDot.style.backgroundColor = 'red';
                tempDot.style.borderRadius = '50%';
                tempDot.style.transform = 'translate(-50%, -50%)';
                tempDot.style.pointerEvents = 'none';
                tempDot.style.zIndex = '999';
                pinsLayer.appendChild(tempDot);
                
                setTimeout(() => tempDot.remove(), 2000);
            }
        });

        function showToast(msg) {
            adminToast.textContent = msg;
            adminToast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                adminToast.classList.remove('show');
            }, 4000);
        }

        // --- Run on Load ---
        renderPins();
    </script>
</body>
</html>
